# ====================================================================
# Vibe Manager AI - Production Docker Compose Overlay (Hardened)
# ====================================================================
# In production, host Nginx manages public traffic and terminates SSL.
# Only the unified internal gateway is exposed, and strictly to 127.0.0.1:8080.
# All internal services (backend, frontend, PostgreSQL) have ZERO host ports
# exposed (!override []), communicating strictly via vibe_stack_network.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ====================================================================

services:
  # Internal Reverse Proxy Gateway bound only to loopback
  gateway:
    ports: !override
      - 127.0.0.1:8080:80

  # Backend API strictly isolated on internal docker bridge network
  backend:
    ports: !override []

  # Frontend Next.js strictly isolated on internal docker bridge network
  frontend:
    ports: !override []
    build:
      args:
        - NEXT_PUBLIC_API_URL=/api

  # PostgreSQL 16 database strictly isolated on internal docker bridge network
  db:
    ports: !override []

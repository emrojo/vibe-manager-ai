name: vibe-manager-stack

services:
  # 1. Reverse Proxy Gateway (Unified Ingress on Port 80)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: vibe-manager-gateway:latest
    container_name: vibe-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND:-80:80}"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - vibe_stack_network

  # 2. Dedicated PostgreSQL 16 Database with Named Persistent Volume
  db:
    image: postgres:16-alpine
    container_name: vibe-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-vibe_manager}
      - POSTGRES_USER=${POSTGRES_USER:-vibe_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vibe_password_2026_secure}
    volumes:
      - vibe_postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND:-5432:5432}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vibe_user} -d ${POSTGRES_DB:-vibe_manager}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vibe_stack_network

  # 3. Backend API & WebSocket Engine (Port 8000)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vibe-manager-backend:latest
    container_name: vibe-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_BIND:-8000:8000}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SECRET_KEY=${SECRET_KEY:-vibe-secret-super-key-2026-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://vibe_user:vibe_password_2026_secure@db:5432/vibe_manager}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@vibemanager.ai}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-Admin1234!}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - DOCKER_RUNNER_IMAGE=vibe-runner:latest
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    volumes:
      - vibe_db_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vibe_stack_network

  # 4. Next.js 15 Web Application (Port 3010 / Gateway Port 80)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: vibe-manager-frontend:latest
    container_name: vibe-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-3010:3010}"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - PORT=3010
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vibe_stack_network

  # 4. Runner Docker Sandbox Image (Built for on-demand task isolation)
  runner:
    build:
      context: ./runner
      dockerfile: Dockerfile
    image: vibe-runner:latest
    container_name: vibe-runner-builder
    restart: "no"
    entrypoint: ["sh", "-c", "echo '[VIBE-RUNNER] Sandbox image ready for on-demand tasks.'"]
    networks:
      - vibe_stack_network

networks:
  vibe_stack_network:
    driver: bridge

volumes:
  vibe_postgres_data:
    driver: local
  vibe_db_data:
    driver: local
